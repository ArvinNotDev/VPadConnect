name: Flutter Mobile Companion

on:
  push:
    branches:
      - feat/flutter-mobile-companion
    paths:
      - "mobile_app/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/flutter-mobile.yml"

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --platforms=android --project-name vpadconnect_mobile .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vpadconnect-mobile-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
